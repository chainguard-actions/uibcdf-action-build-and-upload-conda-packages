name: Test missing meta.yaml validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty directory (no meta.yaml)
        run: |
          mkdir -p /tmp/empty-pkg
      - name: Run action expecting failure (no meta.yaml in directory)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/empty-pkg
          upload: 'false'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml is not found"
