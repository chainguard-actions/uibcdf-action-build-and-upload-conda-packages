name: Test custom label values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install anaconda-client (required by the withdraw script)
        run: pip install anaconda-client 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-spec: "testowner/testpkg/2.0.0/osx-64/testpkg-2.0.0-py310_0.tar.bz2"
          expected-sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          from-label: "release"
          archive-label: "archived"
          token: "fake-token-for-testing"

      - name: Assert action ran with custom labels (fails gracefully on invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With invalid credentials, the action should fail gracefully.
          # The key assertion is that the action STARTED with custom label values
          # (it didn't error on the custom label inputs).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom labels (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid credentials, custom labels accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
