name: Test forbidden --output-folder in conda_build_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create meta.yaml directory and file
        run: |
          mkdir -p /tmp/test-pkg
          cat > /tmp/test-pkg/meta.yaml << 'EOF'
          package:
            name: test-pkg
            version: 0.1.0
          EOF
      - name: Run action expecting failure (--output-folder in conda_build_args)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/test-pkg
          upload: 'false'
          conda_build_args: '--output-folder /tmp/custom-out'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when --output-folder is in conda_build_args"
            exit 1
          fi
          echo "PASS: action correctly rejected --output-folder in conda_build_args"
