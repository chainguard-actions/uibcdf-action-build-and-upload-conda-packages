name: Test missing meta.yaml error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_REF: refs/tags/v1.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify fixture no-recipe directory exists without meta.yaml
        run: |
          DIR="$GITHUB_WORKSPACE/tests/fixtures/no-recipe"
          if [ ! -d "$DIR" ]; then
            echo "FAIL: fixture directory not found at $DIR"
            exit 1
          fi
          if [ -f "$DIR/meta.yaml" ]; then
            echo "FAIL: meta.yaml should NOT exist in $DIR"
            exit 1
          fi
          echo "PASS: directory exists without meta.yaml"

      - name: Run action (expect failure due to missing meta.yaml)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/no-recipe
          python-version: "3.9"
          user: test-user
          upload: "false"

      - name: Assert action failed due to missing meta.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml was missing"
