name: Test missing meta.yaml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory without meta.yaml
        run: |
          mkdir -p "$GITHUB_WORKSPACE/empty-pkg-dir"
          echo "Created empty directory: $GITHUB_WORKSPACE/empty-pkg-dir"
          ls -la "$GITHUB_WORKSPACE/empty-pkg-dir"

      - name: Run action and expect failure due to missing meta.yaml
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: empty-pkg-dir
          python-version: "3.9"
          user: testuser
          token: ""

      - name: Assert action failed due to missing meta.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml was not found"
