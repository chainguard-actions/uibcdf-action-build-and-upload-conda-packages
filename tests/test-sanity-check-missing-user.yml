name: Test sanity check - missing user when upload is true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create meta.yaml fixture
        run: |
          mkdir -p /tmp/conda-pkg
          cat > /tmp/conda-pkg/meta.yaml << 'EOF'
          package:
            name: test-pkg
            version: 0.1.0
          EOF

      - name: Run action expecting failure (no user)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/conda-pkg
          upload: 'true'
          token: 'fake-anaconda-token'
          user: ''

      - name: Assert action failed due to missing user
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when user is missing but upload=true, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when user is missing"
