name: Test upload with label=auto fails on non-release event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake conda and anaconda tools
        run: |
          printf '%s\n' '#!/bin/bash' \
            'echo "fake-conda: called with args: $*"' \
            'if [ "$1" = "build" ]; then' \
            '  out_dir=""' \
            '  prev=""' \
            '  for arg in "$@"; do' \
            '    if [ "$prev" = "--output-folder" ]; then' \
            '      out_dir="$arg"' \
            '    fi' \
            '    prev="$arg"' \
            '  done' \
            '  if [ -n "$out_dir" ]; then' \
            '    mkdir -p "$out_dir/linux-64"' \
            '    touch "$out_dir/linux-64/testpkg-0.0.1-py39_0.tar.bz2"' \
            '    echo "fake-conda: created fake package"' \
            '  fi' \
            '  exit 0' \
            'fi' \
            'if [ "$1" = "convert" ]; then exit 0; fi' \
            'echo "conda 23.0.0"' \
            'exit 0' > /usr/local/bin/conda
          chmod +x /usr/local/bin/conda

          printf '%s\n' '#!/bin/bash' \
            'echo "fake-anaconda: called with args: $*"' \
            'exit 0' > /usr/local/bin/anaconda
          chmod +x /usr/local/bin/anaconda

      - name: Run action with upload=true and label=auto on non-release event
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/conda-pkg
          python-version: "3.9"
          upload: "true"
          label: auto
          user: testuser
          token: ""

      - name: Assert action failed due to incompatible event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When label=auto and the event is workflow_dispatch (not released/prereleased),
          # the upload step should exit 1 with an incompatible trigger message.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when label=auto on non-release event, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when label=auto used with non-release event"
