name: Test missing meta.yaml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure empty directory exists without meta.yaml
        run: |
          mkdir -p tests/fixtures/empty-dir
          rm -f tests/fixtures/empty-dir/meta.yaml

      - name: Run action (expect failure due to missing meta.yaml)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/empty-dir
          python-version: "3.9"
          upload: "false"
          user: testuser

      - name: Assert action failed due to missing meta.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml was not found"
