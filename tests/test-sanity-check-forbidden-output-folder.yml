name: Test sanity check - forbidden --output-folder in conda_build_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create meta.yaml fixture
        run: |
          mkdir -p /tmp/conda-pkg
          cat > /tmp/conda-pkg/meta.yaml << 'EOF'
          package:
            name: test-pkg
            version: 0.1.0
          EOF

      - name: Run action expecting failure (forbidden --output-folder in conda_build_args)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/conda-pkg
          upload: 'false'
          conda_build_args: '--output-folder /tmp/custom-out'

      - name: Assert action failed due to forbidden --output-folder arg
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when --output-folder is in conda_build_args, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected --output-folder in conda_build_args"
