name: Test push event context logging
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action simulating push event
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: pristine/uibcdf--action-build-and-upload-conda-packages/v1.2.0/tests/fixtures/conda-pkg
          python-version: "3.9"
          user: testuser
          token: ""

      - name: Assert action ran with push event context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at conda build (conda not installed in act),
          # but it should have logged the push event context in the first step.
          # The action should NOT be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with push event context (outcome=$OUTCOME)"
