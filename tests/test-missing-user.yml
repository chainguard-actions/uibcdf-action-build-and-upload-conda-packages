name: Test missing user validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create meta.yaml directory and file
        run: |
          mkdir -p /tmp/test-pkg
          cat > /tmp/test-pkg/meta.yaml << 'EOF'
          package:
            name: test-pkg
            version: 0.1.0
          EOF
      - name: Run action expecting failure (no user with upload=true)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/test-pkg
          upload: 'true'
          token: 'fake-token-abc123'
          user: ''
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when user is missing and upload=true"
            exit 1
          fi
          echo "PASS: action correctly failed when user is missing"
