name: Test sanity check - conflicting overwrite/force specification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/conda-pkg
          upload: 'true'
          token: 'sometoken'
          user: 'someuser'
          overwrite: 'true'
          anaconda_upload_args: '--force'
      - name: Assert action failed due to conflicting overwrite/force specification
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both overwrite input and --force in anaconda_upload_args are set, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected conflicting overwrite/force specification"
