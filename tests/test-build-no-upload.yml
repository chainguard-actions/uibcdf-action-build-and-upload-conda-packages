name: Test build conda package without upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install conda (miniconda)
        run: |
          set -euo pipefail
          if ! command -v conda &>/dev/null; then
            wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "$HOME/miniconda3"
            echo "$HOME/miniconda3/bin" >> "$GITHUB_PATH"
            "$HOME/miniconda3/bin/conda" init bash
          else
            echo "conda already available: $(conda --version)"
          fi
      - name: Install conda-build
        run: |
          set -euo pipefail
          source "$HOME/miniconda3/etc/profile.d/conda.sh" 2>/dev/null || true
          conda install -y conda-build
      - id: action
        uses: .
        with:
          meta_yaml_dir: tests/fixtures/conda-pkg
          upload: 'false'
          platform_host: 'true'
      - name: Assert built_paths output is non-empty
        env:
          BUILT_PATHS: ${{ steps.action.outputs.built_paths }}
        run: |
          echo "built_paths: $BUILT_PATHS"
          if [ -z "$BUILT_PATHS" ]; then
            echo "FAIL: expected built_paths to be non-empty after a successful build"
            exit 1
          fi
          echo "PASS: built_paths is non-empty: $BUILT_PATHS"
      - name: Assert built package files exist on disk
        env:
          BUILT_PATHS: ${{ steps.action.outputs.built_paths }}
        run: |
          echo "Checking that built package files exist..."
          found=0
          for path in $BUILT_PATHS; do
            echo "  Checking: $path"
            if [ -f "$path" ]; then
              echo "  EXISTS: $path"
              found=$((found + 1))
            else
              echo "  MISSING: $path"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "FAIL: no built package files found on disk"
            exit 1
          fi
          echo "PASS: $found built package file(s) found on disk"
      - name: Assert paths output is empty (upload=false)
        env:
          PATHS: ${{ steps.action.outputs.paths }}
        run: |
          echo "paths: '$PATHS'"
          if [ -n "$PATHS" ]; then
            echo "FAIL: expected paths to be empty when upload=false, got: $PATHS"
            exit 1
          fi
          echo "PASS: paths is empty as expected when upload=false"
