name: Test meta.yaml found passes validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # meta_yaml_dir is relative to GITHUB_WORKSPACE (the action dir under act)
          meta_yaml_dir: tests/fixtures/conda-pkg
          python-version: "3.9"
          user: test-user
          upload: "false"

      - name: Assert action ran past meta.yaml check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should pass the meta.yaml check (step 2) since the fixture
          # has a valid meta.yaml. It will then fail at conda build (step 3)
          # because conda is not installed in the test environment.
          # Either way, outcome should be 'failure' (not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran and meta.yaml was found (outcome: $OUTCOME)"
