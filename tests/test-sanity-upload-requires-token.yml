name: Test sanity check - upload requires token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/pkg
          upload: 'true'
          token: ''
          user: ''

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when upload=true and no token provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when upload=true and no token provided"
