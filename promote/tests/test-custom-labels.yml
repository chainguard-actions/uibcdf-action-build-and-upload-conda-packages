name: Test custom label values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts custom from-label and to-label values
      - id: promote
        uses: .
        continue-on-error: true
        with:
          package-spec: "testowner/testpkg/2.0.0/osx-64/testpkg-2.0.0-py310_0.conda"
          expected-sha256: "abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
          from-label: "dev"
          to-label: "release"
          token: "fake-invalid-token-for-testing"

      - name: Assert action ran with custom labels (fails gracefully on invalid token)
        env:
          OUTCOME: ${{ steps.promote.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom labels"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid token / nonexistent package)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
