name: Test missing meta.yaml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # tests/fixtures/no-meta-yaml-dir/ is a committed fixture directory with no meta.yaml
      - name: Run action expecting failure (no meta.yaml)
        id: action
        uses: .
        with:
          meta_yaml_dir: tests/fixtures/no-meta-yaml-dir
          python-version: "3.9"
          user: testuser
          token: fake-token
        continue-on-error: true

      - name: Assert action failed due to missing meta.yaml
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing, but got outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml was missing"
