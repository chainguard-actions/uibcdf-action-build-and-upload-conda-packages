name: Test meta.yaml found validation passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # tests/fixtures/conda-pkg/meta.yaml is a committed fixture file
      - name: Run action (meta.yaml present, conda not available so will fail at build)
        id: action
        uses: .
        with:
          meta_yaml_dir: tests/fixtures/conda-pkg
          python-version: "3.9"
          user: testuser
          token: fake-token
        continue-on-error: true

      - name: Assert action did NOT fail at meta.yaml check step
        run: |
          # The action should fail at the conda build step (conda not installed),
          # NOT at the meta.yaml validation step. We verify the meta.yaml check
          # itself passed by confirming the action ran past that step.
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail (no conda), but the meta.yaml check should have passed.
          # We just verify the action ran (outcome is not 'skipped' or 'cancelled').
          if [ "${{ steps.action.outcome }}" == "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          if [ "${{ steps.action.outcome }}" == "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action ran (meta.yaml check passed, failure at conda build step is expected)"
