name: Test sanity check - upload requires user
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/conda-pkg
          upload: 'true'
          token: 'sometoken'
          user: ''
      - name: Assert action failed due to missing user
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when upload=true and user is empty, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when user is missing"
