name: Test basic upload (missing script / no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy artifact file with a known SHA256
      - name: Create dummy artifact
        run: |
          echo "dummy-conda-package-content" > /tmp/dummy-package.conda
          ACTUAL_SHA=$(sha256sum /tmp/dummy-package.conda | awk '{print $1}')
          echo "ARTIFACT_SHA=$ACTUAL_SHA" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          artifact: /tmp/dummy-package.conda
          package-spec: testowner/testpkg/1.0.0/linux-64/dummy-package-1.0.0-py39_0.conda
          expected-sha256: ${{ env.ARTIFACT_SHA }}
          label: main
          candidate-sha: abc1234567890abcdef1234567890abcdef123456
          token: fake-token-for-test

      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RECEIPT: ${{ steps.action.outputs.receipt }}
        run: |
          echo "outcome: $OUTCOME"
          echo "receipt: $RECEIPT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RECEIPT" ]; then
              echo "FAIL: action succeeded but receipt output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with receipt: $RECEIPT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — script/credentials not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
