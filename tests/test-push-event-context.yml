name: Test push event context - getting release data step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with push event context (expect failure at conda build)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/conda-recipe
          python-version: "3.9"
          user: test-user
          upload: "false"

      - name: Assert action ran and logged event data
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at conda build (conda not installed),
          # but the 'getting-release-data' and 'checking-meta_yaml' steps
          # should have succeeded. The outcome will be 'failure' due to
          # conda not being available, which is expected in this environment.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and processed push event context"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
