name: Test sanity check - forbidden conda_build_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/pkg
          upload: 'false'
          conda_build_args: '--no-anaconda-upload'

      - name: Assert action failed due to forbidden build arg
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when --no-anaconda-upload is in conda_build_args, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected --no-anaconda-upload in conda_build_args"
