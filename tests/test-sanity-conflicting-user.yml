name: Test sanity check - conflicting user inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: tests/fixtures/pkg
          upload: 'true'
          token: 'some-token'
          user: 'myorg'
          anaconda_upload_args: '--user anotherorg'

      - name: Assert action failed due to conflicting user specification
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both 'user' input and --user in anaconda_upload_args are set, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected conflicting user specification"
