name: Test missing meta.yaml detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory without meta.yaml
        run: |
          mkdir -p /tmp/conda-pkg-empty

      - name: Run action expecting failure (no meta.yaml)
        id: action
        uses: .
        continue-on-error: true
        with:
          meta_yaml_dir: /tmp/conda-pkg-empty
          upload: 'false'

      - name: Assert action failed due to missing meta.yaml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when meta.yaml is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when meta.yaml is not found"
