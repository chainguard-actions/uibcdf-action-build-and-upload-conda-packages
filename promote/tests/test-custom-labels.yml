name: Test promote with custom labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install anaconda-client (required by the action script)
        run: pip install anaconda-client requests

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-spec: "testowner/testpkg/2.0.0/osx-64/testpkg-2.0.0-py310_0.tar.bz2"
          expected-sha256: "abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
          from-label: "dev"
          to-label: "release"
          token: "fake-invalid-token-for-testing"

      - name: Assert action failed gracefully (custom labels, invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token the Anaconda.org API call will fail, which is expected.
          # The important thing is the action ran (not skipped) and failed gracefully.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (custom labels, invalid token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with an invalid token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
