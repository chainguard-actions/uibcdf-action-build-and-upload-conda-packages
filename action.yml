name: 'Build and upload conda packages'
description: 'Automatic conda package compilation and publication in the speficied Anaconda user or organization.'
author: "Diego Prada-Gracia"
branding:
  icon: "package"
  color: "orange"
inputs:
  meta_yaml_dir:
    description: Path to the directory in the repository where the meta.yaml file is located.
    required: true
  mambabuild:
    description: Using boa (mambabuild) to build the packages.
    required: false
    default: false
  platform_host:
    description: Target host plaform.
    required: false
    default: true
  platform_all:
    description: Target all supported platforms.
    required: false
    default: false
  platform_linux-64:
    description: Target platform linux-64.
    required: false
    default: false
  platform_linux-32:
    description: Target platform linux-32.
    required: false
    default: false
  platform_osx-64:
    description: Target platform osx-64.
    required: false
    default: false
  platform_osx-arm64:
    description: Target platform osx-arm64.
    required: false
    default: false
  platform_linux-ppc64:
    description: Target platform linux-ppc64.
    required: false
    default: false
  platform_linux-ppc64le:
    description: Target platform linux-ppc64le.
    required: false
    default: false
  platform_linux-s390x:
    description: Target platform linux-s390x.
    required: false
    default: false
  platform_linux-armv6l:
    description: Target platform linux-armv6l.
    required: false
    default: false
  platform_linux-armv7l:
    description: Target platform linux-armv7l.
    required: false
    default: false
  platform_linux-aarch64:
    description: Target platform linux-aarch64.
    required: false
    default: false
  platform_win-32:
    description: Target platform win-32.
    required: false
    default: false
  platform_win-64:
    description: Target platform win-32.
    required: false
    default: false
  upload:
    description: Upload built package to anaconda
    required: false
    default: true
  overwrite:
    description: Do not cancel the uploading if a package with the same name is found already in Anaconda.
    required: false
    default: ''
  user:
    description: Name of the Anaconda user or organization where the conda package will be published.
    required: false
    default: ''
  label:
    description: Label of the published conda package.
    required: false
    default: ''
  token:
    description: Token to access to anaconda cloud.
    required: false
    default: ''
  conda_build_args:
    description: Optional arguments to pass to the 'conda build' command.
    required: false
    default: ''
  conda_convert_args:
    description: Optional arguments to pass to the 'conda convert' command.
    required: false
    default: ''
  anaconda_upload_args:
    description: Optional arguments to pass to the 'anaconda upload' command.
    required: false
    default: ''
  github_release:
    description: "Automatically create a GitHub release if a tag was pushed."
    required: false
    default: 'false'
outputs:
  paths:
    description: Paths for the built packages, in the format 'path1 path2 ... pathN'.
    value: ${{steps.packages-uploading.outputs.paths}}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Create GitHub Release
      if: inputs.github_release == 'true' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        echo "::group::Creating GitHub Release"
        if ! gh release view "$REF_NAME" > /dev/null 2>&1; then
          gh release create "$REF_NAME" \
            --title "Release $REF_NAME" \
            --notes "Automated release of version $REF_NAME. See commit history for details."
          echo "Release created: $REF_NAME"
        else
          echo "Release already exists: $REF_NAME"
        fi
        echo "::endgroup::"
    - name: Sanity checks on inputs
      shell: bash -l {0}
      env:
        INPUT_UPLOAD: ${{ inputs.upload }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
        INPUT_CONDA_BUILD_ARGS: ${{ inputs.conda_build_args }}
        INPUT_CONDA_CONVERT_ARGS: ${{ inputs.conda_convert_args }}
        INPUT_ANACONDA_UPLOAD_ARGS: ${{ inputs.anaconda_upload_args }}
      run: |
        echo "::group::Sanity checks on inputs"
        if [ "$INPUT_UPLOAD" == "true" ]; then
          if [ -z "$INPUT_TOKEN" ]; then
            echo -e "An Anaconda token is required when the package is to be uploaded.\n"\
                    "Please specify a 'token', or set 'upload' to 'false'."
            exit 1
          fi
          if [ -z "$INPUT_USER" ]; then
            echo -e "An Anaconda user or organization is required when the package is to be uploaded.\n"\
                    "Please specify a 'user', or set 'upload' to 'false'."
            exit 1
          fi
        fi
        if echo "$INPUT_CONDA_BUILD_ARGS" | grep -qF -- '--no-anaconda-upload'; then
            echo -e "The argument '--no-anaconda-upload' is already used within this action's 'conda build' command and is not allowed in 'conda_build_args'."
            exit 1
        fi
        if echo "$INPUT_CONDA_BUILD_ARGS" | grep -qF -- '--output-folder'; then
            echo -e "The destination folder for the built packages is set internally and the '--output-folder' option is not allowed in 'conda_build_args'.\n" \
                "To retrieve the paths of the built packages, please refer to this action's 'paths' output."
            exit 1
        fi
        if echo "$INPUT_CONDA_CONVERT_ARGS" | grep -qF -- '--output-folder'; then
            echo -e "The destination folder for the converted packages is set internally and the '--output-folder' option is not allowed in 'conda_convert_args'.\n" \
                "To retrieve the paths of the built packages, please refer to this action's 'paths' output."
            exit 1
        fi
        if (echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '--label' || echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '-l') && [ -n "$INPUT_LABEL" ]; then
            echo -e "Both the 'label' input and the '--label'/'-l' option within 'anaconda_upload_args' were specified.\n"\
                "Please only use one of them."
            exit 1
        fi
        if (echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '--user' || echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '-u') && [ -n "$INPUT_USER" ]; then
            echo -e "Both the 'user' input and the '--user'/'-u' option within 'anaconda_upload_args' were specified.\n"\
                "Please only use one of them."
            exit 1
        fi
        if echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '--token' && [ -n "$INPUT_TOKEN" ]; then
            echo -e "Both the 'token' input and the '--token' option within 'anaconda_upload_args' were specified.\n"\
                "Please only use one of them."
            exit 1
        fi
        if echo "$INPUT_ANACONDA_UPLOAD_ARGS" | grep -qF -- '--force' && [ -n "$INPUT_OVERWRITE" ]; then
            echo -e "Both the 'overwrite' input and the '--force' option within 'anaconda_upload_args' were specified.\n"\
                "Please only use one of them."
            exit 1
        fi
        echo "::endgroup::"
    - name: Event trigger data
      shell: bash -l {0}
      run: |
        echo "::group::Information about the trigger event"
        echo "Trigger event: $GITHUB_EVENT_NAME"
        echo "Associated commit SHA: $GITHUB_SHA"
        echo "::endgroup::"
    - name: Checking if meta.yaml is in meta_yaml_dir
      id: checking-meta_yaml
      shell: bash -l {0}
      working-directory: ${{ inputs.meta_yaml_dir }}
      env:
        INPUT_META_YAML_DIR: ${{ inputs.meta_yaml_dir }}
      run: |
        echo "::group::Checking if the file meta.yaml exists"
        if [ ! -f meta.yaml ]; then
           echo "A meta.yaml file with the compilation instructions of the conda package was not found in $INPUT_META_YAML_DIR."
           exit 1
        else
           echo "A meta.yaml file with the compilation instructions of the conda package was found in $INPUT_META_YAML_DIR."
        fi
        echo "::endgroup::"
    - name: Packages compilation
      id: packages-compilation
      shell: bash -l {0}
      working-directory: ${{ inputs.meta_yaml_dir }}
      env:
        INPUT_MAMBABUILD: ${{ inputs.mambabuild }}
        INPUT_CONDA_BUILD_ARGS: ${{ inputs.conda_build_args }}
        INPUT_CONDA_CONVERT_ARGS: ${{ inputs.conda_convert_args }}
        INPUT_PLATFORM_ALL: ${{ inputs.platform_all }}
        INPUT_PLATFORM_LINUX_64: ${{ inputs.platform_linux-64 }}
        INPUT_PLATFORM_LINUX_32: ${{ inputs.platform_linux-32 }}
        INPUT_PLATFORM_OSX_64: ${{ inputs.platform_osx-64 }}
        INPUT_PLATFORM_OSX_ARM64: ${{ inputs.platform_osx-arm64 }}
        INPUT_PLATFORM_LINUX_PPC64: ${{ inputs.platform_linux-ppc64 }}
        INPUT_PLATFORM_LINUX_PPC64LE: ${{ inputs.platform_linux-ppc64le }}
        INPUT_PLATFORM_LINUX_S390X: ${{ inputs.platform_linux-s390x }}
        INPUT_PLATFORM_LINUX_ARMV6L: ${{ inputs.platform_linux-armv6l }}
        INPUT_PLATFORM_LINUX_ARMV7L: ${{ inputs.platform_linux-armv7l }}
        INPUT_PLATFORM_LINUX_AARCH64: ${{ inputs.platform_linux-aarch64 }}
        INPUT_PLATFORM_WIN_32: ${{ inputs.platform_win-32 }}
        INPUT_PLATFORM_WIN_64: ${{ inputs.platform_win-64 }}
        INPUT_PLATFORM_HOST: ${{ inputs.platform_host }}
      run: |
        echo "::group::Building conda package for host platform"
        out_dir=`mktemp -d -t compilation-XXXXXXXXXX`
        safe_out_dir=$(printf '%s' "$out_dir" | tr -d '\n\r')
        echo "out_dir=$safe_out_dir" >> "$GITHUB_OUTPUT"
        if [ "$INPUT_MAMBABUILD" = "true" ]; then
          build_function="mambabuild"
        else
          build_function="build"
        fi
        # Build the conda build command as an array to avoid eval with user input
        conda_build_args_array=()
        if [ -n "$INPUT_CONDA_BUILD_ARGS" ]; then
          # Split on whitespace safely using read
          IFS=' ' read -ra conda_build_args_array <<< "$INPUT_CONDA_BUILD_ARGS"
        fi
        echo "conda $build_function . --no-anaconda-upload --output-folder $safe_out_dir ${conda_build_args_array[*]}"
        conda "$build_function" . --no-anaconda-upload --output-folder "$safe_out_dir" "${conda_build_args_array[@]}"
        HOST_PACKAGE=$(conda "$build_function" . --no-anaconda-upload --output-folder "$safe_out_dir" "${conda_build_args_array[@]}" --output)
        safe_host_package=$(printf '%s' "$HOST_PACKAGE" | tr -d '\n\r')
        echo "HOST_PACKAGE=$safe_host_package" >> "$GITHUB_OUTPUT"
        echo "Package for host platform compiled as $safe_host_package"
        du -sh "$safe_host_package"
        echo "::endgroup::"
        echo "::group::Converting package for other platforms"
        # Build the conda convert command as an array
        conda_convert_args_array=()
        if [ -n "$INPUT_CONDA_CONVERT_ARGS" ]; then
          IFS=' ' read -ra conda_convert_args_array <<< "$INPUT_CONDA_CONVERT_ARGS"
        fi
        platforms_options=()
        if [ "$INPUT_PLATFORM_ALL" = "true" ]; then
          platforms_options+=(-p all)
        fi
        if [ "$INPUT_PLATFORM_LINUX_64" = "true" ]; then
          platforms_options+=(-p linux-64)
        fi
        if [ "$INPUT_PLATFORM_LINUX_32" = "true" ]; then
          platforms_options+=(-p linux-32)
        fi
        if [ "$INPUT_PLATFORM_OSX_64" = "true" ]; then
          platforms_options+=(-p osx-64)
        fi
        if [ "$INPUT_PLATFORM_OSX_ARM64" = "true" ]; then
          platforms_options+=(-p osx-arm64)
        fi
        if [ "$INPUT_PLATFORM_LINUX_PPC64" = "true" ]; then
          platforms_options+=(-p linux-ppc64)
        fi
        if [ "$INPUT_PLATFORM_LINUX_PPC64LE" = "true" ]; then
          platforms_options+=(-p linux-ppc64le)
        fi
        if [ "$INPUT_PLATFORM_LINUX_S390X" = "true" ]; then
          platforms_options+=(-p linux-s390x)
        fi
        if [ "$INPUT_PLATFORM_LINUX_ARMV6L" = "true" ]; then
          platforms_options+=(-p linux-armv6l)
        fi
        if [ "$INPUT_PLATFORM_LINUX_ARMV7L" = "true" ]; then
          platforms_options+=(-p linux-armv7l)
        fi
        if [ "$INPUT_PLATFORM_LINUX_AARCH64" = "true" ]; then
          platforms_options+=(-p linux-aarch64)
        fi
        if [ "$INPUT_PLATFORM_WIN_32" = "true" ]; then
          platforms_options+=(-p win-32)
        fi
        if [ "$INPUT_PLATFORM_WIN_64" = "true" ]; then
          platforms_options+=(-p win-64)
        fi
        if [ "${#platforms_options[@]}" -gt 0 ]; then
            echo "conda convert $safe_host_package -o $safe_out_dir ${conda_convert_args_array[*]} ${platforms_options[*]}"
            conda convert "$safe_host_package" -o "$safe_out_dir" "${conda_convert_args_array[@]}" "${platforms_options[@]}"
        fi
        if [ "$INPUT_PLATFORM_HOST" = "false" ]; then
          rm "$safe_host_package"
          echo "Package for host platform removed."
        fi
        echo "::endgroup::"
    - name: Packages uploading
      id: packages-uploading
      if: inputs.upload == 'true'
      shell: bash -l {0}
      working-directory: ${{ inputs.meta_yaml_dir }}
      env:
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_ANACONDA_UPLOAD_ARGS: ${{ inputs.anaconda_upload_args }}
        COMPILATION_OUT_DIR: ${{ steps.packages-compilation.outputs.out_dir }}
        COMPILATION_HOST_PACKAGE: ${{ steps.packages-compilation.outputs.HOST_PACKAGE }}
      run: |
        echo "::group::Conda packages uploading"
        label=${INPUT_LABEL:-main} #If label is empty (input not provided), set it to 'main'
        force_args=()
        if [ "$INPUT_OVERWRITE" = "true" ]; then
          force_args=(--force)
        fi
        export ANACONDA_API_TOKEN="$INPUT_TOKEN"
        SHORT_SHA="$(git rev-parse --short "$GITHUB_SHA")"
        # Split anaconda_upload_args safely
        anaconda_upload_args_array=()
        if [ -n "$INPUT_ANACONDA_UPLOAD_ARGS" ]; then
          IFS=' ' read -ra anaconda_upload_args_array <<< "$INPUT_ANACONDA_UPLOAD_ARGS"
        fi
        safe_out_dir=$(printf '%s' "$COMPILATION_OUT_DIR" | tr -d '\n\r')
        safe_host_package=$(printf '%s' "$COMPILATION_HOST_PACKAGE" | tr -d '\n\r')
        package_paths=$(find "$safe_out_dir" -type f -name "$(basename "$safe_host_package")")
        paths=()
        for package_path in $package_paths; do
          anaconda upload --user "$INPUT_USER" "${force_args[@]}" --label "$label" "${anaconda_upload_args_array[@]}" "$package_path"
          paths+=("$package_path")
        done
        safe_paths=$(printf '%s' "${paths[*]}" | tr -d '\n\r')
        echo "paths=$safe_paths" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
