name: Test basic usage - invalid credentials fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install anaconda-client (required by the withdraw script)
        run: pip install anaconda-client 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          package-spec: "testowner/testpkg/1.0.0/linux-64/testpkg-1.0.0-py39_0.tar.bz2"
          expected-sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          from-label: main
          archive-label: withdrawn
          token: "fake-token-for-testing"

      - name: Assert action ran and failed gracefully (invalid token/package)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PACKAGE: ${{ steps.action.outputs.package }}
          SHA256: ${{ steps.action.outputs.sha256 }}
          RECEIPT: ${{ steps.action.outputs.receipt }}
        run: |
          echo "outcome: $OUTCOME"
          echo "package: $PACKAGE"
          echo "sha256: $SHA256"
          echo "receipt: $RECEIPT"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, verify outputs are set
            if [ -z "$PACKAGE" ]; then
              echo "FAIL: action succeeded but package output is empty"
              exit 1
            fi
            if [ -z "$SHA256" ]; then
              echo "FAIL: action succeeded but sha256 output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with outputs set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
